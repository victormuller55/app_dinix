workflows:
  testflight:
    name: iOS TestFlight

    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      # App Store Connect integration name in Codemagic
      app_store_connect: Codemagic

    environment:
      flutter: 3.41.7
      xcode: 26.0
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.net.convertix.dinix

      vars:
        # Apple ID from App Store Connect (App information -> Apple ID)
        APP_STORE_APPLE_ID: "6801598678"
        APP_BUNDLE_ID: "com.net.convertix.dinix"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Environment
        script: |
          echo "=============================="
          echo "Branch........: $CM_BRANCH"
          echo "Commit........: $CM_COMMIT"
          echo "Build ID......: $CM_BUILD_ID"
          echo "Workflow......: $CM_WORKFLOW_ID"
          echo "=============================="

          flutter --version
          xcodebuild -version

      - name: Flutter Clean
        script: |
          flutter clean
          flutter pub get

      - name: Analyze
        script: |
          flutter analyze --no-fatal-infos || true

      - name: Tests
        script: |
          flutter test || true

      - name: Configure Version
        script: |
          set -euo pipefail

          VERSION_LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          VERSION_NAME=$(echo "$VERSION_LINE" | cut -d'+' -f1)
          PUBSPEC_BUILD=$(echo "$VERSION_LINE" | cut -d'+' -f2)
          PUBSPEC_BUILD=${PUBSPEC_BUILD:-0}

          digits() {
            local raw
            raw=$(printf '%s' "${1:-}" | tr -d '\r' | tr -d '[:space:]')
            if [ -z "$raw" ]; then
              printf '0'
              return
            fi
            if printf '%s' "$raw" | grep -Eq '^[0-9]+$'; then
              printf '%s' "$raw"
            else
              printf '0'
            fi
          }

          PUBSPEC_BUILD=$(digits "$PUBSPEC_BUILD")
          CM_NUM=$(digits "${CM_BUILD_NUMBER:-0}")

          STORE=0
          TESTFLIGHT=0
          LATEST=0
          if command -v app-store-connect >/dev/null 2>&1; then
            STORE=$(digits "$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)")
            TESTFLIGHT=$(digits "$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)")
            LATEST=$(digits "$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)")
          fi

          MAX=$PUBSPEC_BUILD
          for n in "$CM_NUM" "$STORE" "$TESTFLIGHT" "$LATEST"; do
            if [ "$n" -gt "$MAX" ]; then
              MAX=$n
            fi
          done

          BUILD_NUMBER=$((MAX + 1))

          echo "VERSION_NAME=$VERSION_NAME" >> "$CM_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"

          echo ""
          echo "App Version........: $VERSION_NAME"
          echo "pubspec build......: $PUBSPEC_BUILD"
          echo "Codemagic number...: $CM_NUM"
          echo "App Store latest...: $STORE"
          echo "TestFlight latest..: $TESTFLIGHT"
          echo "ASC latest.........: $LATEST"
          echo "Next build number..: $BUILD_NUMBER"
          echo ""

      - name: Validate Version Config
        script: |
          set -euo pipefail

          echo "VERSION_NAME............: ${VERSION_NAME:?VERSION_NAME nao definido}"
          echo "BUILD_NUMBER............: ${BUILD_NUMBER:?BUILD_NUMBER nao definido}"
          echo "APP_BUNDLE_ID...........: ${APP_BUNDLE_ID:?APP_BUNDLE_ID nao definido}"

          if [ "$VERSION_NAME" = "1.0.0" ]; then
            echo "ERRO: VERSION_NAME 1.0.0 esta fechada no App Store Connect."
            exit 1
          fi

          if ! printf '%s' "$BUILD_NUMBER" | grep -Eq '^[0-9]+$'; then
            echo "ERRO: BUILD_NUMBER invalido: $BUILD_NUMBER"
            exit 1
          fi

          if [ "$BUILD_NUMBER" -lt 1 ]; then
            echo "ERRO: BUILD_NUMBER precisa ser >= 1"
            exit 1
          fi

          echo ""
          echo "Info.plist fonte (ios/Runner/Info.plist)"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" ios/Runner/Info.plist || true

          if ! /usr/libexec/PlistBuddy -c "Print :INAlternativeAppNames:0:INAlternativeAppName" ios/Runner/Info.plist >/dev/null 2>&1; then
            echo "ERRO: INAlternativeAppNames deve ser array de dicionarios com INAlternativeAppName"
            /usr/libexec/PlistBuddy -c "Print :INAlternativeAppNames" ios/Runner/Info.plist || true
            exit 1
          fi

          ALT_NAME=$(/usr/libexec/PlistBuddy -c "Print :INAlternativeAppNames:0:INAlternativeAppName" ios/Runner/Info.plist)
          echo "INAlternativeAppNames...: array de dictionaries"
          echo "INAlternativeAppName....: $ALT_NAME"
          echo "Validacao de versao e Info.plist fonte OK"

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Configure Code Signing
        script: |
          set -euo pipefail

          # ios_signing ja baixou certificado + profiles do Codemagic.
          # Nao chamar fetch-signing-files --create aqui (gera erro de private key).
          xcode-project use-profiles

          # Garante DEVELOPMENT_TEAM em todos os targets.
          PROFILE=$(ls "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision 2>/dev/null | head -n 1 || true)
          if [ -z "${PROFILE:-}" ]; then
            echo "Nenhum provisioning profile encontrado apos use-profiles"
            exit 1
          fi

          TEAM_ID=$(security cms -D -i "$PROFILE" | plutil -extract TeamIdentifier.0 raw -o - -)
          export TEAM_ID
          echo "Applying DEVELOPMENT_TEAM=$TEAM_ID to all Xcode targets"

          python3 <<'PY'
          import os
          import pathlib
          import re

          team = os.environ["TEAM_ID"]
          path = pathlib.Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          def inject(match: re.Match) -> str:
              block = match.group(0)
              if "DEVELOPMENT_TEAM" in block:
                  return re.sub(
                      r"DEVELOPMENT_TEAM = [^;]+;",
                      f"DEVELOPMENT_TEAM = {team};",
                      block,
                  )
              return block.replace(
                  "buildSettings = {",
                  f"buildSettings = {{\n\t\t\t\tDEVELOPMENT_TEAM = {team};",
                  1,
              )

          updated = re.sub(
              r"buildSettings = \{.*?\n\t\t\t\};",
              inject,
              text,
              flags=re.S,
          )
          path.write_text(updated)
          print("Updated DEVELOPMENT_TEAM in project.pbxproj")
          PY

      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --build-name="$VERSION_NAME" \
            --build-number="$BUILD_NUMBER" \
            --no-tree-shake-icons \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Validate IPA Info.plist
        script: |
          set -euo pipefail

          APP_PLIST=""
          if [ -f "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Info.plist" ]; then
            APP_PLIST="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Info.plist"
          else
            IPA=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -n 1 || true)
            if [ -z "${IPA:-}" ]; then
              echo "ERRO: IPA nao encontrado em build/ios/ipa"
              exit 1
            fi
            WORK=$(mktemp -d)
            unzip -q -o "$IPA" -d "$WORK"
            APP_PLIST=$(find "$WORK/Payload" -name Info.plist -path "*.app/Info.plist" | head -n 1 || true)
          fi

          if [ -z "${APP_PLIST:-}" ] || [ ! -f "$APP_PLIST" ]; then
            echo "ERRO: Info.plist final do Runner.app nao encontrado"
            exit 1
          fi

          echo "Info.plist final........: $APP_PLIST"
          echo ""

          MARKETING=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PLIST")
          CURRENT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PLIST")
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PLIST")

          echo "MARKETING_VERSION.......: $MARKETING"
          echo "CURRENT_PROJECT_VERSION.: $CURRENT"
          echo "VERSION_NAME............: $VERSION_NAME"
          echo "BUILD_NUMBER............: $BUILD_NUMBER"
          echo "CFBundleIdentifier......: $BUNDLE"

          if [ "$MARKETING" != "$VERSION_NAME" ]; then
            echo "ERRO: CFBundleShortVersionString ($MARKETING) != VERSION_NAME ($VERSION_NAME)"
            exit 1
          fi

          if [ "$CURRENT" != "$BUILD_NUMBER" ]; then
            echo "ERRO: CFBundleVersion ($CURRENT) != BUILD_NUMBER ($BUILD_NUMBER)"
            exit 1
          fi

          if [ "$BUNDLE" != "$APP_BUNDLE_ID" ]; then
            echo "ERRO: CFBundleIdentifier ($BUNDLE) != $APP_BUNDLE_ID"
            exit 1
          fi

          if ! /usr/libexec/PlistBuddy -c "Print :INAlternativeAppNames:0:INAlternativeAppName" "$APP_PLIST" >/dev/null 2>&1; then
            echo "ERRO: INAlternativeAppNames no IPA nao e array de dictionaries"
            echo "Tipo/valor encontrado:"
            /usr/libexec/PlistBuddy -c "Print :INAlternativeAppNames" "$APP_PLIST" || true
            exit 1
          fi

          ALT_NAME=$(/usr/libexec/PlistBuddy -c "Print :INAlternativeAppNames:0:INAlternativeAppName" "$APP_PLIST")
          echo "INAlternativeAppNames...: array de dictionaries"
          echo "INAlternativeAppName....: $ALT_NAME"
          echo ""
          echo "Validacao do Info.plist final OK"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true
