name: app_dinix
description: "Dinix — controle de gastos pessoais"
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: ^3.11.5

dependencies:
  muller_package:
    git:
      url: https://github.com/victormuller55/muller_package.git
    # Dev local:
    # path: ../muller_package

  flutter:
    sdk: flutter

  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.4
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.1
  mask_text_input_formatter: ^2.9.0
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8
  cupertino_native_better: ^1.5.4
  local_auth: ^3.0.2
  local_auth_android: ^2.0.8
  local_auth_darwin: ^2.0.3
  connectivity_plus: ^6.1.5
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo/icon.png
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/images/logo/icon.png

flutter_native_splash:
  color: "#000000"
  image: assets/images/logo/splash_logo.png
  android: true
  ios: true
  web: false
  ios_content_mode: scaleAspectFit
  android_gravity: center
  android_12:
    color: "#000000"
    image: assets/images/logo/icon.png
    icon_background_color: "#000000"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/bancos/
    - assets/images/logo/
  fonts:
    - family: lato
      fonts:
        - asset: assets/fonts/Lato-Light.ttf
          weight: 300
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
    - family: Phosphor
      fonts:
        - asset: assets/fonts/phosphor/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Fill.ttf
